name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalacja zależności
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Build aplikacji
        run: npm run build

      - name: Sprawdzenie, czy strona ma skrót commita
        run: grep -q "wersja ${GITHUB_SHA::7}" dist/index.html || grep -q "wersja $(git rev-parse --short=7 HEAD)" dist/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: strona
          path: app/dist
